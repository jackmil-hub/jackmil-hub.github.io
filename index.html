<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace / Draft Archive</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 800px; height: 85vh; background: #1e293b; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #334155; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); }
        .header { background: #0f172a; padding: 15px 20px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.1rem; color: #cbd5e1; font-weight: 600; }
        .status-badge { background: #10b981; color: white; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 500; }
        .chat-window { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background: #1e293b; }
        .msg { padding: 12px 16px; border-radius: 8px; max-width: 80%; line-height: 1.5; font-size: 0.95rem; white-space: pre-wrap; word-wrap: break-word; }
        .msg.system { background: rgba(51, 65, 85, 0.4); border: 1px solid rgba(71, 85, 105, 0.5); color: #94a3b8; align-self: flex-start; }
        .msg.user { background: #4f46e5; color: white; align-self: flex-end; }
        .msg.ai { background: #334155; color: #f1f5f9; border: 1px solid #475569; align-self: flex-start; }
        .input-bar { background: #0f172a; padding: 15px; border-top: 1px solid #334155; display: flex; gap: 10px; }
        .text-input { flex: 1; background: #020617; border: 1px solid #334155; color: white; padding: 12px; border-radius: 8px; resize: none; font-size: 0.95rem; outline: none; height: 46px; }
        .text-input:focus { border-color: #6366f1; }
        .btn { background: #4f46e5; color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: 500; cursor: pointer; transition: background 0.2s; height: 46px; }
        .btn:hover { background: #4338ca; }
        .loading { animation: pulse 1.5s infinite ease-in-out; color: #94a3b8; }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header with no input fields -->
        <div class="header">
            <h1>Workspace / Draft Archive</h1>
            <span class="status-badge">Public Node Link Active</span>
        </div>
        
        <!-- Conversation Window -->
        <div id="chatWindow" class="chat-window">
            <div class="msg system">System initialized. Connected directly to an open public interface pipeline. No keys, accounts, or logins required.</div>
        </div>

        <!-- Text Input Form -->
        <div class="input-bar">
            <textarea id="userInput" placeholder="Type a message here..." class="text-input"></textarea>
            <button id="sendBtn" class="btn">Submit</button>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chatWindow');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function appendMessage(text, type) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${type}`;
            msgDiv.textContent = text;
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return msgDiv;
        }

        async function handleSend() {
            const query = userInput.value.trim();
            if (!query) return;

            appendMessage(query, 'user');
            userInput.value = '';

            const loadingBubble = appendMessage("Fetching data from public compute pool...", 'system animate-pulse loading');

            try {
                // Utilizes a public router system that processes base inference requests anonymously
                const response = await fetch('https://duckduckgo.com' + encodeURIComponent(query));
                
                // If direct network checks drop out, we run an open fallback API route
                const fallbackRes = await fetch('https://pollinations.ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        messages: [{ role: 'user', content: query }],
                        model: 'openai'
                    })
                });
                
                const replyText = await fallbackRes.text();
                chatWindow.removeChild(loadingBubble);

                if (replyText) {
                    appendMessage(replyText.trim(), 'ai');
                } else {
                    appendMessage("Error: Public node returned a blank response stream.", 'system');
                }
            } catch (error) {
                chatWindow.removeChild(loadingBubble);
                appendMessage("Public server cluster busy. Please retry your submission.", 'system');
            }
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
    </script>
</body>
</html>
