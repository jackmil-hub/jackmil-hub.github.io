<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace / Draft Archive</title>
    <!-- Solid CSS fallback styling to guarantee a beautiful interface -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 800px; height: 85vh; bg-color: #1e293b; background: #1e293b; border-radius: 12px; display: flex; flex-col: column; flex-direction: column; overflow: hidden; border: 1px solid #334155; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); }
        .header { background: #0f172a; padding: 15px 20px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.1rem; color: #cbd5e1; font-weight: 600; }
        .key-input { background: #020617; border: 1px solid #334155; color: #cbd5e1; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; width: 220px; outline: none; }
        .key-input:focus { border-color: #6366f1; }
        .chat-window { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background: #1e293b; }
        .msg { padding: 12px 16px; border-radius: 8px; max-width: 80%; line-height: 1.5; font-size: 0.95rem; white-space: pre-wrap; word-wrap: break-word; }
        .msg.system { background: rgba(51, 65, 85, 0.4); border: 1px solid rgba(71, 85, 105, 0.5); color: #94a3b8; align-self: flex-start; }
        .msg.user { background: #4f46e5; color: white; align-self: flex-end; }
        .msg.ai { background: #334155; color: #f1f5f9; border: 1px solid #475569; align-self: flex-start; }
        .input-bar { background: #0f172a; padding: 15px; border-top: 1px solid #334155; display: flex; gap: 10px; }
        .text-input { flex: 1; background: #020617; border: 1px solid #334155; color: white; padding: 12px; border-radius: 8px; resize: none; font-size: 0.95rem; outline: none; height: 46px; }
        .text-input:focus { border-color: #6366f1; }
        .btn { background: #4f46e5; color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: 500; cursor: pointer; transition: background 0.2s; height: 46px; }
        .btn:hover { background: #4338ca; }
        .loading { animation: pulse 1.5s infinite ease-in-out; color: #94a3b8; }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Workspace / Draft Archive</h1>
            <input type="password" id="apiKeyInput" placeholder="Paste sk-or-... key here" class="key-input">
        </div>
        
        <!-- Chat Area -->
        <div id="chatWindow" class="chat-window">
            <div class="msg system">System initialized. Secure API bridge active. Enter your OpenRouter key above to start.</div>
        </div>

        <!-- Input Section -->
        <div class="input-bar">
            <textarea id="userInput" placeholder="Type a message..." class="text-input"></textarea>
            <button id="sendBtn" class="btn">Submit</button>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chatWindow');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const apiKeyInput = document.getElementById('apiKeyInput');

        if (localStorage.getItem('free_token')) {
            apiKeyInput.value = localStorage.getItem('free_token');
        }

        function appendMessage(text, type) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${type}`;
            msgDiv.textContent = text;
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return msgDiv;
        }

        async function handleSend() {
            const query = userInput.value.trim();
            const apiKey = apiKeyInput.value.trim();
            
            if (!query) return;
            if (!apiKey) {
                alert("Please paste your OpenRouter API key into the top right box first.");
                return;
            }

            localStorage.setItem('free_token', apiKey);
            appendMessage(query, 'user');
            userInput.value = '';

            const loadingBubble = appendMessage("Querying secure server cluster...", 'system animate-pulse loading');

            try {
                const response = await fetch('https://openrouter.ai', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`,
                        'HTTP-Referer': window.location.href,
                        'X-Title': 'Workspace Archive'
                    },
                    body: JSON.stringify({
                        // Swapped to a rock-solid, ultra-fast free tier endpoint to prevent busy failures
                        model: "google/gemini-2.5-flash:free", 
                        messages: [{ role: "user", content: query }]
                    })
                });

                const data = await response.json();
                chatWindow.removeChild(loadingBubble);

                if (data.choices && data.choices[0] && data.choices[0].message) {
                    appendMessage(data.choices[0].message.content, 'ai');
                } else if (data.error && data.error.message) {
                    appendMessage(`Server Response: ${data.error.message}`, 'system');
                } else {
                    appendMessage("Error: Network endpoint returned an empty data buffer.", 'system');
                }
            } catch (error) {
                chatWindow.removeChild(loadingBubble);
                appendMessage("Connection Refused. Check local firewall proxy settings.", 'system');
            }
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
    </script>
</body>
</html>
